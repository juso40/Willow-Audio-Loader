target-version = "py314"
line-length = 120
show-fixes = true
exclude = [
    "blaudio/_blaudio.pyi",  # generated by pyo3-stub-gen: A002/PYI021/UP045 false positives
]

[lint]
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "PL",  # pylint
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN",
    "BLE",
    "B",
    "A",
    "COM",
    "C4",
    "ISC",
    "PYI",
    "PT",
    "Q",
    "RET",
    "SIM",
    "TID",
    "ARG",
    "RUF",
]
ignore = [
    "E713",
    "PLR2004",
    "N999",
    "ANN401",
    "COM812",  # conflicts with the formatter

    # handled by the formatter
    "E1",
    "E4",
    "E5",
    "W2",
    "W5",
]
